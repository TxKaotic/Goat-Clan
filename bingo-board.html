<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Leaderboard</title>
</head>
<style>
    body{
    background-image: linear-gradient(to right,red, yellow);
  }
    .bingo-container{
        height: 400px;
        width: 400px;
        display: grid;
        background-color: aqua;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        border: 10px solid black;
    }
    .box1{
        border: 10px solid;
    }

    .box2{
        border: 10px solid;
    }

    .box3{
        border: 10px solid;
    }

    .box4{
        border: 10px solid;
    }
</style>
<body>
    <div class="bingo-container">
        <div class="box1">This is a sample Tile for the bingo board</div>
        <div class="box2">This is a sample Tile for the bingo board</div>
        <div class="box3">This is a sample Tile for the bingo board</div>
        <div class="box4">This is a sample Tile for the bingo board</div>
        

    </div>
</body>
</html>
