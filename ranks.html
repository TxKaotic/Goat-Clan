<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking System</title>
  <link rel="stylesheet" href="./assets/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kode+Mono:wght@600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Rock+Salt&display=swap" rel="stylesheet">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a0f;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    h1 {
      color: #0ff;
      text-shadow: 0 0 8px #0ff;
      margin-bottom: 20px;
    }
    .card {
      background: #111;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 15px #0ff5;
      max-width: 400px;
      width: 100%;
    }
    label {
      display: block;
      margin: 12px 0 6px;
      color: #ccc;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: none;
      border-radius: 8px;
      outline: none;
      font-size: 1rem;
    }
    input, select {
      background: #222;
      color: #0ff;
    }
    button {
      background: #0ff;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background: #0cc;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      background: #111;
      box-shadow: 0 0 10px #0ff7;
      display: none;
    }
    #copyButton {
      display: none;
      background: #0f0;
      margin-top: 10px;
    }
    .rank-badge {
      width: 32px;
      height: 32px;
      vertical-align: middle;
      margin-left: 6px;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
   
  <h1>⚔️ GOAT - OSRS ⚔️</h1>
  <div class="card">
    <label for="username">Enter RSN:</label>
    <input type="text" id="username" placeholder="Old School RuneScape Username">
    
    <label for="diary">Achievement Diary Tier:</label>
    <select id="diary">
      <option value="None">None</option>
      <option value="Easy">Easy</option>
      <option value="Medium">Medium</option>
      <option value="Hard">Hard</option>
      <option value="Elite">Elite</option>
      
    </select>
    
    <label for="combatDiary">Combat Achievement Diary:</label>
    <select id="combatDiary">
      <option value="None">None</option>
      <option value="Easy">Easy</option>
      <option value="Medium">Medium</option>
      <option value="Hard">Hard</option>
      <option value="Elite">Elite</option>
      <option value="Master">Master</option>
      <option value="Grandmaster">Grandmaster</option>
    </select>
    
    <button onclick="checkRank()">Check Rank</button>
    <div id="result"></div>
    <button id="copyButton" onclick="copyRankCard()">📋 Copy Rank Card</button>
  </div>

  <!-- html2canvas CDN -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <script>
    const skillNames = [
      'Overall','Attack','Defence','Strength','Hitpoints','Ranged','Prayer',
      'Magic','Cooking','Woodcutting','Fletching','Fishing','Firemaking',
      'Crafting','Smithing','Mining','Herblore','Agility','Thieving',
      'Slayer','Farming','Runecraft','Hunter','Construction'
    ];

    // Notable Ranks override (case insensitive)
    const notableRanks = {
      "are you dry": "Administrator ⚓",
      "mikael myurz": "Administrator ⚓",
      "girldickmeta": "Administrator ⚓",
      "blendz": "Moderator ⚒️",
      "i show hole": "Moderator ⚒️"
    };

    async function fetchPlayerData(username) {
      const proxyUrl = 'https://api.allorigins.win/raw?url=';
      const hiscoresUrl = `https://services.runescape.com/m=hiscore_oldschool/index_lite.ws?player=${encodeURIComponent(username)}`;

      const response = await fetch(proxyUrl + encodeURIComponent(hiscoresUrl));
      if (!response.ok) {
        throw new Error('Player not found or hiscores unavailable');
      }
      const data = await response.text();
      return parseHiscoreData(data);
    }

    function parseHiscoreData(rawData) {
      const lines = rawData.trim().split("\n").map(l => l.split(","));
      const skills = {};
      skillNames.forEach((name, i) => {
        const [rank, level, xp] = lines[i];
        skills[name] = { rank: parseInt(rank), level: parseInt(level), xp: parseInt(xp) };
      });
      return { skills };
    }

    function diaryRankValue(tier) {
      const values = {None: 0, Easy: 1, Medium: 2, Hard: 3, Elite: 4, Master: 5, Grandmaster: 6};
      return values[tier] || 0;
    }

    function determineRank(totalLevel, diary, combatDiary, username) {
      const normalized = username.trim().toLowerCase();

      // Check overrides first
      if (notableRanks[normalized]) {
        return notableRanks[normalized];
      }

      const d = diaryRankValue(diary);
      const c = diaryRankValue(combatDiary);

      if (totalLevel >= 2200 && d >= 4 && c >= 5) return "Paladin";
      if (totalLevel >= 2000 && d >= 3 && c >= 4) return "Knight";
      if (totalLevel >= 1750 && d >= 2 && c >= 3) return "Expert";
      if (totalLevel >= 1500 && d >= 1 && c >= 2) return "Squire";
      return "Feeder";
    }

    async function checkRank() {
      const username = document.getElementById("username").value.trim();
      const diary = document.getElementById("diary").value;
      const combatDiary = document.getElementById("combatDiary").value;
      const resultDiv = document.getElementById("result");
      const copyBtn = document.getElementById("copyButton");

      if (!username) {
        alert("Please enter a username!");
        return;
      }

      try {
        resultDiv.style.display = "block";
        resultDiv.innerText = "Checking...";
        copyBtn.style.display = "none";

        const normalized = username.toLowerCase();
        let totalLevel = 0;

        if (!notableRanks[normalized]) {
          const playerData = await fetchPlayerData(username);
          totalLevel = playerData.skills.Overall.level;
        }

        const rank = determineRank(totalLevel, diary, combatDiary, username);

        

        resultDiv.style.color = "#0ff";
        resultDiv.innerHTML = `
          <span style="color:#0ff">Player:</span> ${username}<br>
          ${!notableRanks[normalized] ? `<span style="color:#0ff">Total Level:</span> ${totalLevel}<br>` : ""}
          <span style="color:#0ff">Rank:</span> <strong>${rank}</strong>
          
        `;

        copyBtn.style.display = "block";
      } catch (err) {
        resultDiv.style.display = "block";
        resultDiv.style.color = "red";
        resultDiv.innerText = "Error: " + err.message;
      }
    }

    async function copyRankCard() {
      const resultDiv = document.getElementById("result");
      try {
        const canvas = await html2canvas(resultDiv, { backgroundColor: "#0a0a0f" });
        const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

        canvas.toBlob(async blob => {
          try {
            if (!isSafari && navigator.clipboard && window.ClipboardItem) {
              await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
              alert("✅ Rank card copied to clipboard! You can paste it into Discord.");
            } else {
              // Safari fallback → copy image URL instead
              const tempInput = document.createElement("input");
              tempInput.value = resultDiv.innerText;
              document.body.appendChild(tempInput);
              tempInput.select();
              document.execCommand("copy");
              document.body.removeChild(tempInput);
              alert("⚠️ Safari limitation: Copied text instead of image.");
            }
          } catch (err) {
            alert("❌ Failed to copy: " + err.message);
          }
        });
      } catch (err) {
        alert("❌ Could not generate image: " + err.message);
      }
    }
  </script>

  <footer class="py-3 my-4">
    <ul class="nav justify-content-center border-bottom pb-3 mb-3">
      <li class="nav-item"><a href="./index.html" class="nav-link px-2 text-body-secondary">Home</a></li>
      <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Bingo Events</a></li>
      <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Ranking System</a></li>
      <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">FAQs</a></li>
      <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">About</a></li>
    </ul>
    <p class="text-center text-body-secondary">Designed By: TxKaotic</p>
  </footer>

</body>
</html>
